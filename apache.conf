# Redirect all HTTP traffic to HTTPS
# FIX #12: Listens on 8080 (unprivileged) — docker-compose maps host:80 → container:8080
<VirtualHost *:8080>
    ServerName localhost
    RewriteEngine On
    # %{SERVER_ADDR} is the server's actual IP from the network socket — never influenced
    # by the client-supplied Host header — prevents Host header injection / open redirect.
    RewriteRule ^(.*)$ https://%{SERVER_ADDR}$1 [R=301,L]
</VirtualHost>

# HTTPS VirtualHost with self-signed certificate
# FIX #12: Listens on 8443 (unprivileged) — docker-compose maps host:443 → container:8443
<VirtualHost *:8443>
    ServerName localhost
    DocumentRoot /var/www/html/webroot

    # SSL Configuration
    SSLEngine on
    SSLCertificateFile    /etc/apache2/ssl/selfsigned.crt
    SSLCertificateKeyFile /etc/apache2/ssl/selfsigned.key

    # Allow TLS 1.3 only — TLS 1.2 and below are disabled
    SSLProtocol -all +TLSv1.3

    # TLS 1.3 cipher suites are negotiated by OpenSSL automatically;
    # SSLCipherSuite applies to TLS 1.2 and below (now disabled).
    # Kept for defence-in-depth if a future config change re-enables TLS 1.2.
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    SSLHonorCipherOrder on
    SSLCompression off
    SSLSessionTickets off

    # FIX #9: AllowOverride None — all directives live here; no .htaccess is ever processed.
    # This means the webroot/.htaccess rules MUST be reproduced here, which we do below.
    # Benefit: an attacker with file-write access cannot override security settings via
    # a dropped .htaccess file.
    <Directory /var/www/html/webroot>
        Options -Indexes +SymLinksIfOwnerMatch
        AllowOverride None
        Require all granted

        # Rules ported from webroot/.htaccess (which is now inert due to AllowOverride None)
        RewriteEngine On
        RewriteBase /

        # Block access to dot files/folders (.env, .git, etc.)
        RewriteRule "^\." - [F]

        # Block direct HTTP access to backend-only directories
        RewriteRule "^(settings|utilities|layouts)/" - [F]

        # URL routing: serve existing files/dirs directly; everything else → index.php
        RewriteRule ^index\.php$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.php [L]
    </Directory>

    # Disable PHP execution inside the avatar upload directory.
    # Moved from uploads/avatars/.htaccess — enforced here so AllowOverride None
    # cannot accidentally un-do it.
    <Directory /var/www/html/webroot/uploads/avatars>
        AllowOverride None
        php_flag engine off
        Options -ExecCGI -Indexes
        AddType text/plain .php .php3 .php4 .php5 .phtml .phar
    </Directory>

    <Directory /var/www/html>
        AllowOverride None
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Security Headers
    Header set X-Content-Type-Options "nosniff"
    Header set X-Frame-Options "DENY"
    Header set X-XSS-Protection "1; mode=block"
    # FIX #18: Added preload — without it the very first visit (before HSTS caches) is
    # vulnerable to SSL stripping. With preload, browsers refuse HTTP before the first visit.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header unset X-Powered-By
    Header always unset X-Powered-By

    # Prevent browser from caching JavaScript and CSS files so code changes
    # are always picked up immediately.
    <FilesMatch "\.(js|css)$">
        Header set Cache-Control "no-store, no-cache, must-revalidate"
        Header set Pragma "no-cache"
        Header set Expires "0"
    </FilesMatch>

    # Disable directory listing
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</VirtualHost>
