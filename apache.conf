# Redirect all HTTP traffic to HTTPS
<VirtualHost *:80>
    ServerName localhost
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{SERVER_NAME}:8443$1 [R=301,L]
</VirtualHost>

# HTTPS VirtualHost with self-signed certificate
<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html/webroot

    # SSL Configuration
    SSLEngine on
    SSLCertificateFile    /etc/apache2/ssl/selfsigned.crt
    SSLCertificateKeyFile /etc/apache2/ssl/selfsigned.key

    # Disable weak protocols and ciphers
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES

    <Directory /var/www/html/webroot>
        Options -Indexes +SymLinksIfOwnerMatch
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html>
        AllowOverride None
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Security Headers
    Header set X-Content-Type-Options "nosniff"
    Header set X-Frame-Options "DENY"
    Header set X-XSS-Protection "1; mode=block"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header unset X-Powered-By
    Header always unset X-Powered-By

    # Prevent browser from caching JavaScript and CSS files so code changes
    # are always picked up immediately.
    <FilesMatch "\.(js|css)$">
        Header set Cache-Control "no-store, no-cache, must-revalidate"
        Header set Pragma "no-cache"
        Header set Expires "0"
    </FilesMatch>

    # Disable directory listing
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</VirtualHost>
