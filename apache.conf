ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
StartServers 2
MinSpareServers 2
MaxSpareServers 4
MaxRequestWorkers 8
MaxConnectionsPerChild 500
<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/html/webroot
    LimitRequestBody 3145728
    Timeout 30
    <Directory /var/www/html>
        AllowOverride None
        Require all denied
    </Directory>
    <Directory /var/www/html/webroot>
        Options -Indexes -Includes -ExecCGI
        AllowOverride None
        Require all granted
    </Directory>
    <FilesMatch "(^\.|\.(sql|sh|md|ya?ml|env|bak|log|ini|conf)$)">
        Require all denied
    </FilesMatch>
    ErrorLog /proc/self/fd/2
    # Query strings, cookies, passwords and form bodies are excluded.
    LogFormat "%a %t %m %U %>s %D" safe
    CustomLog /proc/self/fd/1 safe
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Cache-Control "no-store"
    IncludeOptional /etc/apache2/moneyflow-proxy.conf
</VirtualHost>
