services:
  web:
    ports: !reset []
    environment:
      APP_ENV: production
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN}
    volumes:
      - ./deploy/proxy.conf:/etc/apache2/moneyflow-proxy.conf:ro
    networks:
      frontend: {ipv4_address: 172.30.91.2}
  proxy:
    image: caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      frontend: {ipv4_address: 172.30.91.3}
    depends_on: [web]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
networks:
  frontend:
    ipam:
      config: [{subnet: 172.30.91.0/28}]
volumes:
  caddy_data: {}
  caddy_config: {}
