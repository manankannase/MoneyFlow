services:
  db:
    image: mysql:8.4@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69
    environment:
      MYSQL_DATABASE: moneyflow_db
      MYSQL_USER: moneyflow_app
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_password, db_root_password]
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./deploy/grants.sql:/docker-entrypoint-initdb.d/02-grants.sql:ro
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=$$(cat /run/secrets/db_root_password) mysql -uroot -Nse "SELECT version FROM moneyflow_db.schema_version" | grep -qx 2']
      interval: 5s
      timeout: 5s
      retries: 30
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.0
    restart: unless-stopped
  web:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      DATABASE_HOST: db
      DATABASE_NAME: moneyflow_db
      DATABASE_USER: moneyflow_app
      DATABASE_PASS_FILE: /run/secrets/db_password
      HMAC_SECRET_FILE: /run/secrets/app_key
    secrets: [db_password, app_key]
    ports: ["127.0.0.1:${WEB_PORT:-8080}:8080"]
    volumes: [avatars:/var/lib/moneyflow/avatars]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=33,gid=33
      - /var/run/apache2:rw,noexec,nosuid,size=4m,uid=33,gid=33
      - /var/lock/apache2:rw,noexec,nosuid,size=4m,uid=33,gid=33
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 100
    networks: [backend, frontend]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
secrets:
  db_password: {file: ./.secrets/db_password}
  db_root_password: {file: ./.secrets/db_root_password}
  app_key: {file: ./.secrets/app_key}
networks:
  backend: {internal: true}
  frontend: {}
volumes:
  db_data: {}
  avatars: {}
